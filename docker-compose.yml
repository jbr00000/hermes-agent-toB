name: hermes_tob

# The default Compose stack contains only the shared Chat infrastructure.
# Application and Agent sandbox containers are opt-in profiles so that
# `docker compose up -d` cannot accidentally enable execution capabilities.
services:
  mysql:
    image: mysql:8.4.11
    container_name: hermes_tob_mysql
    environment:
      MYSQL_DATABASE: ${HERMES_MYSQL_DATABASE:-hermes_tob}
      MYSQL_USER: ${HERMES_MYSQL_USER:-hermes_app}
      MYSQL_PASSWORD: ${HERMES_MYSQL_PASSWORD:?Set HERMES_MYSQL_PASSWORD in compose.env}
      MYSQL_ROOT_PASSWORD: ${HERMES_MYSQL_ROOT_PASSWORD:?Set HERMES_MYSQL_ROOT_PASSWORD in compose.env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${HERMES_MYSQL_PORT:-13306}:3306"
    volumes:
      - hermes-mysql-data:/var/lib/mysql
    networks:
      - hermes-data
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.2.15-alpine
    container_name: hermes_tob_redis
    environment:
      HERMES_REDIS_PASSWORD: ${HERMES_REDIS_PASSWORD:?Set HERMES_REDIS_PASSWORD in compose.env}
      TZ: UTC
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --requirepass "$$HERMES_REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${HERMES_REDIS_PORT:-16379}:6379"
    volumes:
      - hermes-redis-data:/data
    networks:
      - hermes-data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$HERMES_REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  hermes-server:
    profiles: ["app"]
    build: .
    image: hermes-agent-tob:dev
    container_name: hermes_tob_server
    command: ["sh", "-c", "alembic upgrade head && python -m server"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.hermes-dev:/data
    environment:
      HERMES_SERVER_PORT: "8000"
      HERMES_HEADLESS: "1"
      TERMINAL_ENV: docker
      TERMINAL_DOCKER_NETWORK: "false"
      DOCKER_HOST: tcp://sandbox-docker:2375
      # Hermes application storage; customer read-only data sources use the
      # separate HERMES_DB_URL configuration from /data/.env.
      HERMES_DATABASE_URL: mysql+pymysql://${HERMES_MYSQL_USER:-hermes_app}:${HERMES_MYSQL_PASSWORD}@mysql:3306/${HERMES_MYSQL_DATABASE:-hermes_tob}?charset=utf8mb4
      HERMES_REDIS_URL: redis://:${HERMES_REDIS_PASSWORD}@redis:6379/0
      HERMES_REQUIRE_AGENT_WORKER: "1"
      HERMES_ALLOW_EMBEDDED_AGENT_WORKER: "0"
    networks:
      - hermes-data
      - hermes-egress
      - hermes-sandbox-control
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  hermes-worker:
    profiles: ["app"]
    image: hermes-agent-tob:dev
    container_name: hermes_tob_worker
    command: ["python", "-m", "server.worker"]
    depends_on:
      hermes-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./.hermes-dev:/data
    environment:
      HERMES_HEADLESS: "1"
      TERMINAL_ENV: docker
      TERMINAL_DOCKER_NETWORK: "false"
      DOCKER_HOST: tcp://sandbox-docker:2375
      HERMES_DATABASE_URL: mysql+pymysql://${HERMES_MYSQL_USER:-hermes_app}:${HERMES_MYSQL_PASSWORD}@mysql:3306/${HERMES_MYSQL_DATABASE:-hermes_tob}?charset=utf8mb4
      HERMES_REDIS_URL: redis://:${HERMES_REDIS_PASSWORD}@redis:6379/0
      HERMES_AGENT_RUN_TIMEOUT_SECONDS: ${HERMES_AGENT_RUN_TIMEOUT_SECONDS:-300}
      HERMES_AGENT_MAX_ATTEMPTS: ${HERMES_AGENT_MAX_ATTEMPTS:-3}
    networks:
      - hermes-data
      - hermes-egress
      - hermes-sandbox-control
    restart: unless-stopped

  sandbox-docker:
    profiles: ["agent"]
    image: docker:27-dind
    container_name: hermes_tob_sandbox_daemon
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:2375
      - --tls=false
    volumes:
      - hermes-sandbox-docker-data:/var/lib/docker
    networks:
      - hermes-sandbox-control
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Web 检索组件（docker compose --profile search up -d）
  # 只挂 hermes-egress：可出公网、可被 hermes-server/worker 访问，
  # 但够不到 hermes-data 上的业务库。方案详见 docs/联网检索接入方案.md §4。
  # 镜像全部按 digest 锁定（2026-08-11 拉取）；升级 = 显式改 digest 的交付动作。
  # ------------------------------------------------------------------
  searxng:
    profiles: ["search"]
    image: searxng/searxng:latest@sha256:cd22dbf7fac8b25d5e39e65af53a4b47009df5ad3162e270c477fd5b30ce03f2
    container_name: hermes_tob_searxng
    environment:
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY:?Set SEARXNG_SECRET_KEY in compose.env}
      SEARXNG_SETTINGS_PATH: /tmp/searxng/settings.yml
    # 官方 entrypoint 只在"从零生成 settings.yml"时才替换 secret_key；
    # 我们自带配置文件，所以先 sed 注入密钥到容器本地副本再执行原入口。
    # 配置以只读挂载进 /config-ro，渲染产物写容器内 /tmp——
    # 保证宿主机仓库里的 settings.yml 永远只有占位符，真实密钥不会落进 git。
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        mkdir -p /etc/searxng /tmp/searxng
        && sed "s/__SEARXNG_SECRET_KEY__/$${SEARXNG_SECRET_KEY}/g" /config-ro/settings.yml > /tmp/searxng/settings.yml
        && exec /usr/local/searxng/entrypoint.sh
    volumes:
      # settings.yml 必须显式开启 json format，否则 /search?format=json 返回 403
      - ./deploy/searxng:/config-ro:ro
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-18080}:8080"
    networks:
      - hermes-egress
    restart: unless-stopped

  firecrawl-api:
    profiles: ["search"]
    image: ghcr.io/firecrawl/firecrawl:2.10.19-production@sha256:50446cbc0bc700a78cc588c96bd38a97f01cc4299c99b349c7bfa1ba57b6d7ed
    container_name: hermes_tob_firecrawl_api
    # harness 在同一容器内拉起 api + worker（官方 self-host 编排）
    command: ["node", "dist/src/harness.js", "--start-docker"]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      ENV: local
      USE_DB_AUTHENTICATION: "false"
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      # 用户/库必须保持 postgres/postgres：nuq-postgres 镜像的 pg_cron
      # 绑定 cron.database_name=postgres，换库名会导致建表脚本整体失败
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:?Set FIRECRAWL_POSTGRES_PASSWORD in compose.env}
      POSTGRES_DB: postgres
      POSTGRES_HOST: firecrawl-nuq-postgres
      POSTGRES_PORT: "5432"
      NUQ_RABBITMQ_URL: amqp://firecrawl:${FIRECRAWL_RABBITMQ_PASSWORD:?Set FIRECRAWL_RABBITMQ_PASSWORD in compose.env}@firecrawl-rabbitmq:5672
      NUM_WORKERS_PER_QUEUE: "4"
      MAX_CONCURRENT_JOBS: "5"
      HARNESS_STARTUP_TIMEOUT_MS: "120000"
    ports:
      - "127.0.0.1:${FIRECRAWL_API_PORT:-13002}:3002"
    depends_on:
      firecrawl-redis:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
      firecrawl-nuq-postgres:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
    networks:
      - hermes-egress
    restart: unless-stopped

  firecrawl-playwright:
    profiles: ["search"]
    image: ghcr.io/firecrawl/playwright-service:latest@sha256:468009bae00911d40d7120d58489a1d529362c22c45585cb9076094fe61b0025
    container_name: hermes_tob_firecrawl_playwright
    environment:
      PORT: "3000"
      MAX_CONCURRENT_PAGES: "5"
      BLOCK_MEDIA: "true" # 拦图片/字体/媒体请求，省出网带宽；正文抽取不受影响
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
    networks:
      - hermes-egress
    restart: unless-stopped

  firecrawl-redis:
    profiles: ["search"]
    # 与主 redis 同版本镜像；独立实例、无持久化、无密码——只在 hermes-egress
    # 内网可见、不暴露宿主机端口（主 redis 因映射宿主机端口才设密码）。
    image: redis:7.2.15-alpine
    container_name: hermes_tob_firecrawl_redis
    command: ["redis-server", "--bind", "0.0.0.0"]
    networks:
      - hermes-egress
    restart: unless-stopped

  firecrawl-nuq-postgres:
    profiles: ["search"]
    image: ghcr.io/firecrawl/nuq-postgres:latest@sha256:aed86f62858f29bd971abddcdeb301c12888098d2cf5d33c1ba42b053bc460f6
    container_name: hermes_tob_firecrawl_nuq_postgres
    environment:
      # 同上：必须为 postgres/postgres，否则 pg_cron 扩展创建失败、nuq 表缺失
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:?Set FIRECRAWL_POSTGRES_PASSWORD in compose.env}
      POSTGRES_DB: postgres
    volumes:
      - hermes-firecrawl-nuq-data:/var/lib/postgresql/data
    networks:
      - hermes-egress
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  firecrawl-rabbitmq:
    profiles: ["search"]
    image: rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    container_name: hermes_tob_firecrawl_rabbitmq
    environment:
      # 显式建账号：rabbitmq 默认 guest 用户仅允许 localhost 连接
      RABBITMQ_DEFAULT_USER: firecrawl
      RABBITMQ_DEFAULT_PASS: ${FIRECRAWL_RABBITMQ_PASSWORD:?Set FIRECRAWL_RABBITMQ_PASSWORD in compose.env}
    volumes:
      - hermes-firecrawl-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - hermes-egress
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # P3 浏览器兜底（docker compose --profile browser up -d）
  # 专用无头 Chromium，hermes-server/worker 通过 CDP 连接
  # （config.yaml: browser.cdp_url: http://172.31.0.20:9222）。
  # 只挂 hermes-egress：可出公网、可被 server/worker 访问，
  # 够不到 hermes-data 上的业务库。可导航目标再由
  # config.yaml 的 browser.allowed_targets 白名单收口。
  #
  # 为什么用固定 IP 而不是服务名：Chromium 的 /json/* 发现接口
  # 拒绝非 localhost/非 IP 字面量的 Host 头（反 DNS rebinding），
  # http://browser:9222 会被拒，IP 字面量正常；返回的
  # webSocketDebuggerUrl 回显请求 Host，同网段内容器可达。
  # 改动子网/地址时必须同步修改 config.yaml 的 browser.cdp_url。
  # ------------------------------------------------------------------
  browser:
    profiles: ["browser"]
    image: chromedp/headless-shell:stable@sha256:2d349b544a1ea6b5b5fd7c0fe99215ff662339c57407ee2e8c0a11af93516b04
    container_name: hermes_tob_browser
    # 镜像入口 run.sh 已带 --no-sandbox / swiftshader / CDP :9223，
    # 并由 socat 转发 0.0.0.0:9222 -> 127.0.0.1:9223，无需额外 command
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=512m
    ports:
      # 仅供宿主机 dev 调试（本机 python -m server 场景）：
      # config.yaml 写 browser.cdp_url: http://127.0.0.1:19222
      - "127.0.0.1:${BROWSER_CDP_PORT:-19222}:9222"
    networks:
      hermes-egress:
        ipv4_address: 172.31.0.20
    healthcheck:
      # 镜像无 curl/wget；用 bash /dev/tcp 探测 CDP 端口可连即可
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9223'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # 知识库构建栈（docker compose --profile knowledge up -d）
  # ES（BM25 全文）+ Milvus（向量）+ Milvus 内部依赖 etcd/minio + 知识库 worker。
  # 全部只挂 hermes-data：不出网，仅 hermes-server/worker 可达；
  # etcd/minio 不映射宿主机端口。ES/Milvus 各映射一个 127.0.0.1 回环端口，
  # 仅供宿主机 dev（本机 python -m server / 知识库 worker 跑在宿主机时直连）；
  # 全容器化部署时忽略映射端口，用内网地址（es_url 用容器内网 http.port=19200）。
  # 注意：minio/etcd 是 Milvus standalone 的内部组件，与知识库文档存储无关
  # ——文档原文存宿主机卷 ./.hermes-dev/knowledge/files/。
  # MinerU 与 embedding 端点是客户自备服务，不在本栈内。
  # 镜像全部按 digest 锁定（2026-08-13 拉取）；升级 = 显式改 digest 的交付动作。
  # ------------------------------------------------------------------
  elasticsearch:
    profiles: ["knowledge"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.4@sha256:e8726a9a59f5776274181bc398f799db9249f1a7f483ea684201c9832e933c57
    container_name: hermes_tob_elasticsearch
    environment:
      discovery.type: single-node
      # 容器内网端口与客户可能已有的 ES :9200 错开；宿主机映射仅绑回环，
      # 供本机 dev 直连（全容器化部署时无需使用该映射）
      http.port: "19200"
      # 内网无暴露，默认关安全层；客户要求开启时在 .env 配
      # KNOWLEDGE_ES_PASSWORD 并改用 elastic 账号（见 server/knowledge/es_client.py）
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      TZ: UTC
    mem_limit: 2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      # 仅宿主机 dev 直连（本机 python -m server 场景）：127.0.0.1 回环
      - "127.0.0.1:${KNOWLEDGE_ES_PORT:-19200}:19200"
    volumes:
      - hermes-es-data:/usr/share/elasticsearch/data
    networks:
      - hermes-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:19200/_cluster/health?wait_for_status=yellow&timeout=3s >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  etcd:
    profiles: ["knowledge"]
    image: quay.io/coreos/etcd:v3.5.21@sha256:a3ccd299377af4b9968d8cbaaf9722fe354297f11908f74a846075e1e5f4ee89
    container_name: hermes_tob_etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      TZ: UTC
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - hermes-etcd-data:/etcd
    networks:
      - hermes-data
    healthcheck:
      # quay.io/coreos/etcd 镜像无 /bin/sh，CMD-SHELL 不可用；
      # 3.5 的 etcdctl 默认 API v3，直接 exec 即可
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio:
    profiles: ["knowledge"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: hermes_tob_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in compose.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in compose.env}
      TZ: UTC
    command: ["minio", "server", "/minio_data"]
    volumes:
      - hermes-minio-data:/minio_data
    networks:
      - hermes-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  milvus:
    profiles: ["knowledge"]
    image: milvusdb/milvus:v2.5.16@sha256:c3e6773fa7553edd1922b0cd7af90838eebba3751219aebd52a65fafa1c8e739
    container_name: hermes_tob_milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # Milvus defaults to minioadmin:minioadmin — must mirror minio's root credentials
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in compose.env}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in compose.env}
      TZ: UTC
    command: ["milvus", "run", "standalone"]
    ports:
      # 仅宿主机 dev 直连（本机 python -m server 场景）：127.0.0.1 回环
      - "127.0.0.1:${KNOWLEDGE_MILVUS_PORT:-19530}:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - hermes-milvus-data:/var/lib/milvus
    networks:
      - hermes-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9091/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  hermes-knowledge-worker:
    profiles: ["knowledge"]
    image: hermes-agent-tob:dev
    container_name: hermes_tob_knowledge_worker
    # alembic 幂等：与 hermes-server 并发执行时一方失败会随 restart 重试收敛。
    # 注意：知识库 HTTP API 在 hermes-server（profile app）里，完整使用需
    # `--profile app --profile knowledge` 同启；本服务独立可跑仅验证构建链路。
    command: ["sh", "-c", "alembic upgrade head && python -m server.knowledge.worker"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./.hermes-dev:/data  # 与 server 共享：knowledge/files/ 文档原文
    environment:
      HERMES_HEADLESS: "1"
      HERMES_DATABASE_URL: mysql+pymysql://${HERMES_MYSQL_USER:-hermes_app}:${HERMES_MYSQL_PASSWORD}@mysql:3306/${HERMES_MYSQL_DATABASE:-hermes_tob}?charset=utf8mb4
      HERMES_REDIS_URL: redis://:${HERMES_REDIS_PASSWORD}@redis:6379/0
    networks:
      # hermes-data 有出站 NAT：可达客户内网的 MinerU / embedding 端点
      - hermes-data
    restart: unless-stopped

networks:
  hermes-data:
    name: hermes_tob_data
    driver: bridge
  hermes-egress:
    name: hermes_tob_egress
    driver: bridge
    # browser 服务需要固定 IP（见上），故显式声明子网。
    # 已有部署首次应用需重建该网络（上面只有无状态的 search/browser 组件）：
    #   docker compose --profile search --profile browser down
    #   docker network rm hermes_tob_egress && docker compose ... up -d
    ipam:
      config:
        - subnet: 172.31.0.0/24
  hermes-sandbox-control:
    name: hermes_tob_sandbox_control
    driver: bridge
    internal: true

